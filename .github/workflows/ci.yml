name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Format
        run: deno fmt --check contracts guardrails

      - name: Test the checks
        run: deno test --allow-read --allow-write contracts guardrails

      - name: Test publish
        run: sh scripts/test_publish.sh
